# Nexus Orb: 2 contenedores (app Python + nginx). Datos en el volumen nexus_data (SQLite).
# El backend anterior (Postgres + Spring) queda en el perfil "legacy" solo para migrar los datos:
#   docker compose --profile legacy up -d postgres   (ver docs/MIGRACION.md)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: nexus-app
    restart: always
    environment:
      PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      NEXUS_ADMIN_USER: ${NEXUS_ADMIN_USER:-admin}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-}
      NEXUS_VAPID_PUBLIC_KEY: ${NEXUS_VAPID_PUBLIC_KEY:-}
      NEXUS_VAPID_PRIVATE_KEY: ${NEXUS_VAPID_PRIVATE_KEY:-}
      NEXUS_PUSH_SUBJECT: ${NEXUS_PUSH_SUBJECT:-mailto:admin@localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXUS_AI_MODELS: ${NEXUS_AI_MODELS:-}
      NEXUS_AI_PROVIDER: ${NEXUS_AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JARVIS_MODEL: ${JARVIS_MODEL:-}
      JARVIS_EFFORT: ${JARVIS_EFFORT:-}
    volumes:
      - nexus_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus_net

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nexus-frontend
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    networks:
      - nexus_net

  # ---- Solo para migrar desde la versión anterior (perfil "legacy") ----
  postgres:
    profiles: ["legacy"]
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_net

volumes:
  nexus_data:
    driver: local
  # Volumen del backend anterior: se conserva intacto hasta que confirmes la migración
  postgres_data:
    driver: local

networks:
  nexus_net:
    driver: bridge
