version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proyectazo-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proyectazo_db}
      POSTGRES_USER: ${POSTGRES_USER:-proyectazo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proyectazo_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proyectazo_user} -d ${POSTGRES_DB:-proyectazo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proyectazo_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyectazo-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-proyectazo_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-proyectazo_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-proyectazo_secret_2026}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      PORT: 8081
    networks:
      - proyectazo_net

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: proyectazo-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    networks:
      - proyectazo_net

volumes:
  postgres_data:
    driver: local

networks:
  proyectazo_net:
    driver: bridge
