name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  nexus:
    name: Nexus AI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic python-dotenv google-genai pytest
      - run: python -m pytest -q tests

  frontend:
    name: Frontend (Tailwind + sintaxis JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Tests del parser de captura
        run: node --test tests/js/*.test.mjs
      - name: Comprobar sintaxis JS
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: Build de imágenes
    runs-on: ubuntu-latest
    needs: [backend, nexus, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=ci docker compose build
