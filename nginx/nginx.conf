events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # Frontend SPA & PWA routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Service Worker & Manifest: Never cache
        location ~* (sw\.js|manifest\.json)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Código de la app y CSS compilado: nombres sin hash, así que siempre revalidar
        location ^~ /js/ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~ ^/assets/(tailwind|contraste)\.css$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Cache static assets (excluding sw.js and manifest.json)
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Proxy Backend REST API
        location /api/ {
            proxy_pass http://backend:8081/api/;
            # Host con puerto: Spring lo compara con el Origin del navegador para saber si es la misma web
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Validación de sesión para el microservicio Nexus (no expuesta al exterior)
        location = /_auth_check {
            internal;
            proxy_pass http://backend:8081/api/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Health del microservicio: público para el indicador de estado
        location = /nexus/health {
            proxy_pass http://nexus-ai:8002/health;
        }
        location = /nexus/api/nexus/health {
            proxy_pass http://nexus-ai:8002/health;
        }

        # Proxy Nexus AI Cognitive Microservice (requiere sesión válida)
        location /nexus/ {
            auth_request /_auth_check;
            proxy_pass http://nexus-ai:8002/;
            # Host con puerto: Spring lo compara con el Origin del navegador para saber si es la misma web
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Healthcheck endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
