server:
  port: ${PORT:8081}

spring:
  application:
    name: nexus-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/proyectazo_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

app:
  cors:
    # Lista blanca separada por comas. Evita "*" en producción.
    # "null" es el origen de la app de escritorio (Electron carga index.html con file://).
    # Es seguro porque la API se autentica con Bearer token, no con cookies.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://localhost:3000,null}
  auth:
    # Usuario inicial (solo se crea si no existe ninguno). Sin contraseña se genera una temporal y se imprime en el log.
    admin-user: ${NEXUS_ADMIN_USER:admin}
    admin-password: ${NEXUS_ADMIN_PASSWORD:}
  push:
    # Claves VAPID opcionales. Si faltan, se generan una vez y se guardan en la base de datos.
    vapid-public-key: ${NEXUS_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${NEXUS_VAPID_PRIVATE_KEY:}
    subject: ${NEXUS_PUSH_SUBJECT:mailto:admin@localhost}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
